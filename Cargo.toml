[package]
name = "tail-delay-feasibility"
version = "1.0.0"
edition = "2024"
description = "Certified tail-delay feasibility tests for reconfigurable systems"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "tdf"
path = "src/lib.rs"

[[bin]]
name = "tdf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
rayon = "1.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
statrs = "0.18"

# Thin LTO with parallel code generation keeps the final link short.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"

# The tests simulate long horizons against closed forms: optimised code with
# debug assertions enabled.
[profile.test]
opt-level = 3
codegen-units = 16
